# Cloudflare Worker that runs live Google Flights searches (via SerpApi) for the dashboard,
# and saves routes to routes.json, so the browser never needs your API key or a GitHub token.
# Deployed by .github/workflows/deploy-worker.yml; see the README for the one-time setup.
name = "flight-tracker"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
# Overwritten on deploy with this repository and its GitHub Pages address.
GITHUB_REPO = ""
ALLOWED_ORIGIN = ""
