name: Check flights

on:
  schedule:
    - cron: "23 */12 * * *"  # 2x a day (GitHub may delay scheduled runs by some minutes)
  workflow_dispatch:        # "Run workflow" button, and "Search now" on the dashboard
  push:
    branches: [main]
    paths: [routes.json]    # search right away when you add or edit routes

permissions:
  contents: write

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q tests

      - name: Search flights
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py --demo-if-no-key

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update flight prices $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
